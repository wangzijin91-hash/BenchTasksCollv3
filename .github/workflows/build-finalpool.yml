          TASKS
          count="$(find tasks/finalpool -mindepth 1 -maxdepth 1 -type d | wc -l)"
          echo "Copied $count implemented task directories"
          test "$count" -eq 54
          rm -f .github/workflows/build-finalpool.yml
          git config user.name finalpool-builder
          git config user.email finalpool-builder@users.noreply.github.com
          git add -A tasks/finalpool .github/workflows/build-finalpool.yml
          git commit -m "Add all implemented tasks to finalpool"
          git push origin HEAD:finalpool
