name: Build finalpool
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finalpool
          fetch-depth: 0
      - name: Copy implemented tasks from immutable revisions
        run: |
          set -euo pipefail
          rm -rf tasks/finalpool
          mkdir -p tasks/finalpool
          while IFS='|' read -r revision source task; do
            test -n "$revision"
            temporary="$(mktemp -d)"
            git archive "$revision" "$source" | tar -x -C "$temporary"
            test -d "$temporary/$source"
            test ! -e "tasks/finalpool/$task"
            cp -a "$temporary/$source" "tasks/finalpool/$task"
            diff -r "$temporary/$source" "tasks/finalpool/$task"
            rm -rf "$temporary"
          done <<'TASKS'
          0be3288e0fd4ae1f241d3ce9cc1c864ae2606d37|tasks/lv/chat-bot|chat-bot
