name: Assemble finalpool
on: push
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finalpool
          fetch-depth: 0
      - name: Copy implemented tasks from immutable revisions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/build-finalpool.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "done <<'TASKS'" in line)
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'TASKS')
          rows = [line.strip() for line in lines[start + 1:end]]
          assert len(rows) == 54
          Path('/tmp/finalpool-task-rows').write_text('\n'.join(rows) + '\n')
          PY
          rm -rf tasks/finalpool
          mkdir -p tasks/finalpool
          while IFS='|' read -r revision source task; do
            test -n "$revision"
            temporary="$(mktemp -d)"
            git archive "$revision" "$source" | tar -x -C "$temporary"
            test -d "$temporary/$source"
            test ! -e "tasks/finalpool/$task"
            cp -a "$temporary/$source" "tasks/finalpool/$task"
            diff -r "$temporary/$source" "tasks/finalpool/$task"
            rm -rf "$temporary"
          done < /tmp/finalpool-task-rows
          count="$(find tasks/finalpool -mindepth 1 -maxdepth 1 -type d | wc -l)"
          echo "Copied $count implemented task directories"
          test "$count" -eq 54
          rm -f .github/workflows/build-finalpool.yml
          git config user.name finalpool-builder
          git config user.email finalpool-builder@users.noreply.github.com
          git add -A tasks/finalpool .github/workflows/build-finalpool.yml
          git commit -m "Add all implemented tasks to finalpool"
          git push origin HEAD:finalpool
